name: CI

on:
  pull_request:
  # Pushes to main run this workflow through publish.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check server.json matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const npm = srv.packages.find((p) => p.registryType === "npm") ?? {};
            const checks = [
              ["package.json mcpName", pkg.mcpName, srv.name],
              ["server.json version", srv.version, pkg.version],
              ["npm package identifier", npm.identifier, pkg.name],
              ["npm package version", npm.version, pkg.version],
            ];
            const bad = checks.filter(([, actual, expected]) => actual !== expected);
            for (const [what, actual, expected] of bad) console.error(`::error::${what} is ${actual}, expected ${expected}`);
            process.exit(bad.length ? 1 : 0);
          '
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
