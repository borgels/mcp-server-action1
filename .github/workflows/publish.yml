name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild of main without the layer cache, so fixes in the base image and OS
  # packages land even when the code has not changed. Servers get them on their next pull.
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: |
            org.opencontainers.image.source=https://github.com/borgels/mcp-server-action1
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
