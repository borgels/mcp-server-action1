name: Release

# Push a tag like `v1.2.3` (matching package.json and server.json) to publish
# that version to npm and the MCP Registry. Both authenticate with the publish
# job's GitHub OIDC token; no secrets are stored.
#
# - npm: trusted publishing for this repository and this workflow file
#   (release.yml), allowing `npm publish`. Provenance is attached.
# - MCP Registry: `mcp-publisher login github-oidc` grants the namespace of
#   the repository owner (io.github.borgels/*). server.json is validated by
#   ci.yml before anything is published.
#
# A version that is already on npm or in the MCP Registry is skipped there,
# so a failed run can be re-run. Pre-release tags (`v1.2.3-rc.1`) go to the
# npm dist-tag `next` and are not published to the MCP Registry.
#
# One-time bootstrap (npm cannot configure a trusted publisher for a package
# that does not exist yet):
#   1. Publish the first version by hand from a clean checkout of its commit:
#      `npm login`, `npm ci`, `npm publish --access public`.
#   2. Push its tag. npm is skipped; the version is published to the MCP
#      Registry.
#   3. Shortly before the next release, configure the trusted publisher
#      (npm >= 11.15, account 2FA):
#        npm trust github <package> --file release.yml \
#          --repo borgels/<repository> --allow-publish
#      A new configuration expires unless it completes a publish within two
#      days.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Builds and tests the package without an OIDC token; the publish job only
  # receives the tarball.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag, package.json and server.json versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const tag = process.argv[1];
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const npm = srv.packages.find((p) => p.registryType === "npm") ?? {};
            const versions = { "package.json": pkg.version, "server.json": srv.version, "server.json npm package": npm.version };
            const bad = Object.entries(versions).filter(([, v]) => v !== tag);
            for (const [file, v] of bad) console.error(`::error::${file} version ${v} does not match tag ${tag}`);
            process.exit(bad.length ? 1 : 0);
          ' "$TAG_VERSION"

      - run: npm ci

      # `prepack` runs typecheck, tests and build.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Pinned; bumped by hand (MCP_PUBLISHER_VERSION also in ci.yml).
      # npm >= 11.5.1 is required for trusted publishing.
      NPM_VERSION: 11.21.2
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `registry-url`: with it, setup-node writes an .npmrc containing
      # `_authToken=${NODE_AUTH_TOKEN}`, and the empty token makes npm fail
      # with 401 before it tries OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher

      # npm requires an explicit dist-tag for pre-release versions.
      - name: Publish to npm
        run: |
          set -euo pipefail
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm; skipping npm publish."
            exit 0
          fi
          tarballs=("$RUNNER_TEMP"/package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one tarball, found ${#tarballs[@]}"
            exit 1
          fi
          tag_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            tag_args=(--tag next)
          fi
          npx --yes "npm@${NPM_VERSION}" publish "${tarballs[0]}" \
            --provenance --access public --ignore-scripts "${tag_args[@]}"

      # The registry reads mcpName from the published npm package.
      - name: Publish to the MCP Registry
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          read -r name version < <(node -p 'const s = require("./server.json"); `${encodeURIComponent(s.name)} ${s.version}`')
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${name}/versions/${version}")"
          if [ "$status" = "200" ]; then
            echo "Version ${version} is already in the MCP Registry; skipping."
            exit 0
          fi
          spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          for i in $(seq 1 12); do
            npm view "$spec" mcpName >/dev/null 2>&1 && break
            echo "Waiting for $spec on npm ($i)"
            sleep 10
          done
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
