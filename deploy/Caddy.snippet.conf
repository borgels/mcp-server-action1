# Append one site block per Action1 organization to your reverse proxy config.
# This server exposes only /mcp (no separate enrollment/callback path), so the whole
# hostname proxies straight to your gateway/auth layer in front of the container.
# Reload with: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy

action1.<company>.mcp.example.com {
	reverse_proxy 127.0.0.1:8080
}
